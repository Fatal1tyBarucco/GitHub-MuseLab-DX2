name: Docker

on:
  schedule:
    - cron: '30 0 * * *'
  push:
    branches: ["main"]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'
    tags: ['*.*.*']
  pull_request:
    branches: ["main"]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'

env:
  REGISTRY: docker.io
  IMAGE_NAME: rbarucco/github-muselab-dx2

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    concurrency:
      group: docker-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set image name (lowercase)
        id: vars
        run: |
          # Docker requires lowercase repository names
          GHCR_IMAGE=$(echo '${{ github.repository_owner }}/d2x' | tr '[:upper:]' '[:lower:]')
          echo "ghcr_image=$GHCR_IMAGE" >> $GITHUB_OUTPUT
          echo "GHCR_IMAGE=$GHCR_IMAGE" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: rbarucco
          password: ${{ secrets.DOCKER }}

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=nightly,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build summary
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" == "success" ]; then
            echo "## ✅ Docker Build Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Docker Build Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Hub:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**GHCR:** \`ghcr.io/${{ env.GHCR_IMAGE }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: Apex
