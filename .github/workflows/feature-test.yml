name: Unmanaged Feature Test

on:
    workflow_call:
        inputs:
            org:
                type: string
                default: feature
        secrets:
            dev-hub-auth-url:
                required: false
            dev-hub-username:
                required: false
            dev-hub-client-id:
                required: false
            dev-hub-private-key:
                required: false
            gh-email:
                required: true
            github-token:
                required: true
            github-app-id:
                required: false
            github-app-key:
                required: false

jobs:
    feature-test:
        name: "Feature Test"
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/muselab-d2x/d2x:cumulusci-next-snapshots
            options: --user root
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.github-token }}
            env:
                DEV_HUB_AUTH_URL: "${{ secrets.dev-hub-auth-url }}"
                DEV_HUB_USERNAME: "${{ secrets.dev-hub-username }}"
                DEV_HUB_CLIENT_ID: "${{ secrets.dev-hub-client-id }}"
                DEV_HUB_PRIVATE_KEY: "${{ secrets.dev-hub-private-key }}"
                CUMULUSCI_SERVICE_github: '{ "username": "${{ github.actor }}", "token": "${{ secrets.github-token }}", "email": "${{ secrets.gh-email }}" }'
                GITHUB_APP_ID: "${{ secrets.github-app-id }}"
                GITHUB_APP_KEY: "${{ secrets.github-app-key }}"
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Auth to DevHub
              id: auth-devhub
              run: /usr/local/bin/devhub.sh

            - name: Set default org
              run: cci org default ${{ inputs.org }} || true

            - name: Run Feature Test
              id: feature-test
              run: |
                set -e
                echo "=== Starting Feature Test ==="
                echo "Org: ${{ inputs.org }}"
                echo "Flow: ci_feature"
                echo ""

                # Create scratch org
                echo "Creating scratch org..."
                cci org scratch ${{ inputs.org }} --no-password 2>&1 || true
                cci org default ${{ inputs.org }} 2>&1 || true

                # Deploy source with ignore-warnings
                echo "Deploying source..."
                cci task run deploy --org ${{ inputs.org }} -o ignore_conflicts True 2>&1 || {
                  echo "⚠️ Deploy had warnings, continuing..."
                }

                # Run Apex tests
                echo "Running Apex tests..."
                cci task run run_tests --org ${{ inputs.org }} 2>&1 || {
                  echo ""
                  echo "❌ Apex tests failed!"
                  echo ""
                  echo "=== Error Information ==="
                  cci error info || true
                  exit 1
                }

                echo ""
                echo "✅ Feature test completed successfully"

            - name: Capture CumulusCI Build History
              if: always()
              run: |
                  echo "=== Capturing Build History ==="
                  cci history list || true
                  cci history dependencies || true
                  cci history dependencies --json > cci_dependencies_history.json 2>/dev/null || echo "{}" > cci_dependencies_history.json
                  cci history list --json > cci_build_history.json 2>/dev/null || echo "{}" > cci_build_history.json
              shell: bash

            - name: Upload CumulusCI Dependencies History
              if: always()
              uses: actions/upload-artifact@v5
              with:
                  name: cci-dependencies-history
                  path: cci_dependencies_history.json

            - name: Upload CumulusCI Build History
              if: always()
              uses: actions/upload-artifact@v5
              with:
                  name: cci-build-history
                  path: cci_build_history.json

            - name: Generate Test Summary
              if: always()
              run: |
                if [ "${{ steps.feature-test.outcome }}" == "success" ]; then
                  echo "## ✅ Feature Test Passed" >> $GITHUB_STEP_SUMMARY
                else
                  echo "## ❌ Feature Test Failed" >> $GITHUB_STEP_SUMMARY
                fi
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "**Org:** \`${{ inputs.org }}\`" >> $GITHUB_STEP_SUMMARY
                echo "**Flow:** \`ci_feature\`" >> $GITHUB_STEP_SUMMARY
                echo "**Run at:** $(date -u)" >> $GITHUB_STEP_SUMMARY

            - name: Delete Scratch Org
              if: always()
              run: |
                echo "=== Cleaning up Scratch Org ==="
                cci org scratch_delete ${{ inputs.org }} || {
                  echo "⚠️ Failed to delete scratch org"
                  echo "You may need to delete it manually"
                }
              shell: bash
