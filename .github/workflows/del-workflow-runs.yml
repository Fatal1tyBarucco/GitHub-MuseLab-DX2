name: Delete old workflow runs

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Delete old workflow runs
        env:
          GH_TOKEN: *** secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          DAYS_TO_KEEP=30
          CUTOFF_DATE=$(date -d "-${DAYS_TO_KEEP} days" -u +%Y-%m-%dT%H:%M:%SZ)

          echo "Repository: $REPO"
          echo "Deleting runs older than: $CUTOFF_DATE"

          TOTAL_DELETED=0
          TOTAL_FAILED=0

          # Get all workflow IDs
          WORKFLOW_IDS=$(gh api "repos/$REPO/actions/workflows" --jq '.workflows[].id')

          for WF_ID in $WORKFLOW_IDS; do
            WF_NAME=$(gh api "repos/$REPO/actions/workflows/$WF_ID" --jq '.name')
            echo ""
            echo "Processing: $WF_NAME (ID: $WF_ID)"

            # Get completed runs older than cutoff
            RUN_IDS=$(gh api "repos/$REPO/actions/workflows/$WF_ID/runs?status=completed&per_page=100" \
              --jq ".workflow_runs[] | select(.created_at < \"$CUTOFF_DATE\") | .id" 2>/dev/null || echo "")

            if [ -z "$RUN_IDS" ]; then
              echo "  No old runs to delete"
              continue
            fi

            RUN_COUNT=$(echo "$RUN_IDS" | wc -l)
            echo "  Found $RUN_COUNT old runs"

            for RUN_ID in $RUN_IDS; do
              echo "  Deleting run $RUN_ID..."
              if gh api -X DELETE "repos/$REPO/actions/runs/$RUN_ID" 2>/dev/null; then
                echo "    ✅ Deleted"
                TOTAL_DELETED=$((TOTAL_DELETED + 1))
              else
                echo "    ❌ Failed"
                TOTAL_FAILED=$((TOTAL_FAILED + 1))
              fi
            done
          done

          echo ""
          echo "=== Summary ==="
          echo "Total deleted: $TOTAL_DELETED"
          echo "Total failed: $TOTAL_FAILED"

      - name: Generate summary
        if: always()
        run: |
          echo "## 🧹 Workflow Cleanup" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run at:** $(date -u)" >> $GITHUB_STEP_SUMMARY
