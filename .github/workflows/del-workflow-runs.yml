name: Delete old workflow runs

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Delete old workflow runs
        uses: actions/github-script@v7
        with:
          github-token: *** secrets.CCI_GITHUB_TOKEN }}
          script: |
            const daysToKeep = 30;
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - daysToKeep);

            console.log(`Deleting workflow runs older than ${cutoffDate.toISOString()}`);

            let totalDeleted = 0;
            let totalFailed = 0;

            // List all workflows
            const workflows = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            for (const workflow of workflows.data.workflows) {
              console.log(`\nProcessing workflow: ${workflow.name}`);

              // List runs for this workflow
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.id,
                per_page: 100,
                status: 'completed'
              });

              for (const run of runs.data.workflow_runs) {
                const runDate = new Date(run.created_at);

                if (runDate < cutoffDate) {
                  try {
                    await github.rest.actions.deleteWorkflowRun({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id: run.id
                    });
                    console.log(`  ✅ Deleted run ${run.id} (${run.created_at})`);
                    totalDeleted++;
                  } catch (error) {
                    console.log(`  ❌ Failed to delete run ${run.id}: ${error.message}`);
                    totalFailed++;
                  }
                }
              }
            }

            console.log(`\n=== Summary ===`);
            console.log(`Total deleted: ${totalDeleted}`);
            console.log(`Total failed: ${totalFailed}`);

      - name: Generate summary
        if: always()
        run: |
          echo "## 🧹 Workflow Cleanup" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run at:** $(date -u)" >> $GITHUB_STEP_SUMMARY
