name: Build Multi-Arch Docker Images

on:
    push:
        branches:
            - main
            - cumulusci-next**
        paths:
            - Dockerfile
            - .github/workflows/build.yml
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                target: [no-browser, browser]
                platform: [linux/amd64, linux/arm64]
            fail-fast: false
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Set image name (lowercase)
              run: |
                # Docker requires lowercase repository names
                IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
                echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

                if [ "${{ github.ref_name }}" == "main" ]; then
                  echo "IMAGE_TAG=latest" >> $GITHUB_ENV
                else
                  echo "IMAGE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
                fi

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: ${{ github.event_name == 'push' }}
                  tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}${{ matrix.target == 'browser' && '-browser' || '' }}${{ matrix.platform == 'linux/arm64' && '-arm64' || '' }}
                  platforms: ${{ matrix.platform }}
                  target: ${{ matrix.target }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Generate build summary
              if: always()
              run: |
                if [ "${{ steps.build.outcome }}" == "success" ]; then
                  echo "## ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
                else
                  echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
                fi
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "**Target:** \`${{ matrix.target }}\`" >> $GITHUB_STEP_SUMMARY
                echo "**Platform:** \`${{ matrix.platform }}\`" >> $GITHUB_STEP_SUMMARY
                echo "**Tag:** \`ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY

    merge-manifests:
        needs: build
        runs-on: ubuntu-latest
        if: success()
        steps:
            - name: Set image name (lowercase)
              run: |
                IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
                echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

                if [ "${{ github.ref_name }}" == "main" ]; then
                  echo "IMAGE_TAG=latest" >> $GITHUB_ENV
                else
                  echo "IMAGE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
                fi

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Create and push multi-arch manifests
              run: |
                  echo "Creating multi-arch manifests..."

                  # For no-browser
                  docker buildx imagetools create -t ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
                    ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
                    ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-arm64 || {
                    echo "⚠️ Failed to create no-browser manifest"
                    exit 1
                  }

                  # For browser
                  docker buildx imagetools create -t ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-browser \
                    ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-browser \
                    ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-browser-arm64 || {
                    echo "⚠️ Failed to create browser manifest"
                    exit 1
                  }

            - name: Inspect manifests
              run: |
                  echo "=== No-browser manifest ==="
                  docker buildx imagetools inspect ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
                  echo ""
                  echo "=== Browser manifest ==="
                  docker buildx imagetools inspect ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-browser

            - name: Generate summary
              if: always()
              run: |
                echo "## 🏗️ Multi-Arch Build Complete" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "**Image:** \`ghcr.io/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
                echo "**Tag:** \`${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
