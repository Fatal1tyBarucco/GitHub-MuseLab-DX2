<template>
    <lightning-card icon-name="utility:crossfilter" title={title}>
        <div class="slds-p-left--medium slds-p-right--medium">
            <ul class="slds-list--vertical">
                <template for:each={similarProperties} for:item="item">
                    <li key={item.Id} class="slds-item slds-m-bottom--medium">
                        <div class="slds-media">
                            <div class="slds-media__figure">
                                <img src={item.Thumbnail__c} class="slds-avatar--large slds-avatar--circle" alt={item.Name} />
                            </div>
                            <div class="slds-media__body">
                                <a data-record-id={item.Id} onclick={handleNavigateToRecord}>
                                    <h3 class="slds-text-heading--small">{item.Name}</h3>
                                </a>
                                <ul class="slds-grid slds-wrap">
                                    <li class="slds-item slds-size--1-of-2">
                                        <span class="slds-text-color--weak slds-m-right--small">Bedrooms:</span> {item.Beds__c}
                                    </li>
                                    <li class="slds-item slds-size--1-of-2">
                                        <span class="slds-text-color--weak slds-m-right--small">Bathrooms:</span> {item.Baths__c}
                                    </li>
                                    <li class="slds-item slds-size--1-of-2">
                                        <span class="slds-text-color--weak slds-m-right--small">Price:</span> {item.formattedPrice}
                                    </li>
                                    <li class="slds-item slds-size--1-of-2">
                                        <span class="slds-text-color--weak slds-m-right--small">Status:</span> {item.Status__c}
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </li>
                </template>
            </ul>
        </div>
    </lightning-card>
</template>
