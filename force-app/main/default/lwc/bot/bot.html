<template>
    <div class="bot-container">
        <div class="content">
            <template for:each={messageList} for:item="message">
                <div key={message.messageText} class="message-row">
                    <div class="message-icon">
                        <lightning-icon
                            icon-name={message.author === 'Me' ? 'standard:avatar_loading' : 'standard:custom_notification'}
                            size="small">
                        </lightning-icon>
                    </div>
                    <div class="message-content">
                        <p><strong>{message.author}</strong></p>
                        <p class="slds-text-body">{message.messageText}</p>

                        <template lwc:if={message.imageURL}>
                            <figure class="slds-image slds-image--card slds-m-top--x-small">
                                <img src={message.imageURL} alt="Uploaded image" />
                            </figure>
                        </template>

                        <template for:each={message.buttons} for:item="button">
                            <lightning-button
                                key={button.value}
                                label={button.label}
                                name={button.value}
                                onclick={handlePostbackClick}
                                class="message-button">
                            </lightning-button>
                        </template>

                        <template for:each={message.records} for:item="record">
                            <dl key={record.id} class="slds-list--horizontal slds-wrap">
                                <template for:each={record.fields} for:item="field">
                                    <div key={field.name}>
                                        <dt class="slds-item--label slds-text-color--weak slds-truncate">{field.name}:</dt>
                                        <dd class="slds-item--detail slds-truncate">
                                            <template lwc:if={field.linkURL}>
                                                <a href={field.linkURL}>{field.value}</a>
                                            </template>
                                            <template lwc:else>
                                                {field.value}
                                            </template>
                                        </dd>
                                    </div>
                                </template>
                            </dl>
                        </template>

                        <template for:each={message.items} for:item="item">
                            <div key={item.name} class="list-item">
                                <template lwc:if={item.linkURL}>
                                    <a href={item.linkURL} target="_blank">{item.name}</a>
                                </template>
                                <template lwc:else>
                                    {item.name}
                                </template>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>

        <div class="footer slds-form-element slds-p-horizontal--x-small">
            <div class="slds-form-element__control">
                <input
                    type="text"
                    class="slds-input utterance-input"
                    placeholder="Ask DreamBot..."
                    onkeypress={handleKeyPress} />
                <lightning-input
                    type="file"
                    name="file"
                    accept="image/*;capture=camera"
                    onchange={handleFileUpload}
                    label="Select a file">
                </lightning-input>
            </div>
        </div>
    </div>
</template>
